<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-label="Three ways to wait one minute">
<rect width="1100" height="400" fill="#fcfcfb"/>
<text x='40.0' y='34.0' text-anchor='start' font-family='-apple-system, Helvetica Neue, Arial, sans-serif' font-size='20' font-weight='600' fill='#0b0b0b'>One minute of waiting, three ways</text>
<text x='40.0' y='56.0' text-anchor='start' font-family='-apple-system, Helvetica Neue, Arial, sans-serif' font-size='14' font-weight='normal' fill='#52514e'>Blue blocks are model calls, each resends the whole context. The gray line is a suspended task, no tokens spent.</text>
<text x='40.0' y='134.0' text-anchor='start' font-family='-apple-system, Helvetica Neue, Arial, sans-serif' font-size='14' font-weight='600' fill='#0b0b0b'>await: Claude Code</text>
<text x='40.0' y='152.0' text-anchor='start' font-family='-apple-system, Helvetica Neue, Arial, sans-serif' font-size='12' font-weight='normal' fill='#52514e'>background task, notification on completion</text>
<line x1='330' x2='850' y1='138.0' y2='138.0' stroke='#c9c8c2' stroke-width='3'/>
<rect x='330.0' y='125.0' width='13.0' height='26' rx='3' fill='#2a78d6' stroke='#fcfcfb' stroke-width='2'/>
<rect x='837.0' y='125.0' width='13.0' height='26' rx='3' fill='#2a78d6' stroke='#fcfcfb' stroke-width='2'/>
<text x='866.0' y='143.0' text-anchor='start' font-family='-apple-system, Helvetica Neue, Arial, sans-serif' font-size='13' font-weight='normal' fill='#0b0b0b'>2 calls per event</text>
<text x='40.0' y='210.0' text-anchor='start' font-family='-apple-system, Helvetica Neue, Arial, sans-serif' font-size='14' font-weight='600' fill='#0b0b0b'>sleep-poll: Codex with clock.sleep</text>
<text x='40.0' y='228.0' text-anchor='start' font-family='-apple-system, Helvetica Neue, Arial, sans-serif' font-size='12' font-weight='normal' fill='#52514e'>sleep 45 seconds, then check</text>
<line x1='330' x2='850' y1='214.0' y2='214.0' stroke='#c9c8c2' stroke-width='3'/>
<rect x='330.0' y='201.0' width='13.0' height='26' rx='3' fill='#2a78d6' stroke='#fcfcfb' stroke-width='2'/>
<rect x='347.3' y='201.0' width='13.0' height='26' rx='3' fill='#2a78d6' stroke='#fcfcfb' stroke-width='2'/>
<rect x='750.3' y='201.0' width='13.0' height='26' rx='3' fill='#2a78d6' stroke='#fcfcfb' stroke-width='2'/>
<rect x='767.7' y='201.0' width='13.0' height='26' rx='3' fill='#2a78d6' stroke='#fcfcfb' stroke-width='2'/>
<text x='866.0' y='219.0' text-anchor='start' font-family='-apple-system, Helvetica Neue, Arial, sans-serif' font-size='13' font-weight='normal' fill='#0b0b0b'>3 to 4 calls per minute</text>
<text x='40.0' y='286.0' text-anchor='start' font-family='-apple-system, Helvetica Neue, Arial, sans-serif' font-size='14' font-weight='600' fill='#0b0b0b'>spin: Codex goal without sleep</text>
<text x='40.0' y='304.0' text-anchor='start' font-family='-apple-system, Helvetica Neue, Arial, sans-serif' font-size='12' font-weight='normal' fill='#52514e'>a new turn 0.03 s after the previous one</text>
