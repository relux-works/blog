<text x='40.0' y='210.0' text-anchor='start' font-family='-apple-system, Helvetica Neue, Arial, sans-serif' font-size='14' font-weight='600' fill='#e7ebe7'>sleep-опрос: Codex с clock.sleep</text>
<text x='40.0' y='228.0' text-anchor='start' font-family='-apple-system, Helvetica Neue, Arial, sans-serif' font-size='12' font-weight='normal' fill='#bbc4bc'>сон 45 секунд, потом проверка</text>
