<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-label="Три способа ждать одну минуту">
<rect width="1100" height="400" fill="#111411"/>
<text x='40.0' y='34.0' text-anchor='start' font-family='-apple-system, Helvetica Neue, Arial, sans-serif' font-size='20' font-weight='600' fill='#e7ebe7'>Одна минута ожидания тремя способами</text>
<text x='40.0' y='56.0' text-anchor='start' font-family='-apple-system, Helvetica Neue, Arial, sans-serif' font-size='14' font-weight='normal' fill='#bbc4bc'>Синие блоки это вызовы модели, каждый переотправляет весь контекст. Серая линия это приостановленная задача, токены не тратятся.</text>
<text x='40.0' y='134.0' text-anchor='start' font-family='-apple-system, Helvetica Neue, Arial, sans-serif' font-size='14' font-weight='600' fill='#e7ebe7'>await: Claude Code</text>
