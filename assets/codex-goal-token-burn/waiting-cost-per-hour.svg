<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Стоимость часа ожидания в токенах">
<rect width="1000" height="340" fill="#fcfcfb"/>
<text x='40' y='36' font-family='-apple-system, Helvetica Neue, Arial, sans-serif' font-size='20' font-weight='600' fill='#0b0b0b'>Сколько токенов стоит один час ожидания</text>
<text x='40' y='60' font-family='-apple-system, Helvetica Neue, Arial, sans-serif' font-size='14' fill='#52514e'>Входные токены за час, миллионы. Контекст 160–245 тысяч токенов, задача одна: дождаться детей.</text>
<rect x='40' y='100' width='6.0' height='44' rx='4' stroke='#2a78d6' stroke-width='2' fill='none' stroke-dasharray='6 4'/>
<text x='58.0' y='128.0' font-family='-apple-system, Helvetica Neue, Arial, sans-serif' font-size='18' font-weight='600' fill='#0b0b0b'>0.5 M</text>
<text x='40' y='92' font-family='-apple-system, Helvetica Neue, Arial, sans-serif' font-size='14' fill='#52514e'>Есть sleep или уведомление: 1–2 шага на событие (оценка)</text>
<rect x='40' y='172' width='163.2' height='44' rx='4' fill='#2a78d6'/>
<text x='215.2' y='200.0' font-family='-apple-system, Helvetica Neue, Arial, sans-serif' font-size='18' font-weight='600' fill='#0b0b0b'>19.9 M</text>
<text x='40' y='164' font-family='-apple-system, Helvetica Neue, Arial, sans-serif' font-size='14' fill='#52514e'>Опрос через шелл, сессия B: 43 шага в час</text>
<rect x='40' y='244' width='683.9' height='44' rx='4' fill='#2a78d6'/>
<text x='735.9' y='272.0' font-family='-apple-system, Helvetica Neue, Arial, sans-serif' font-size='18' font-weight='600' fill='#0b0b0b'>83.4 M</text>
<text x='40' y='236' font-family='-apple-system, Helvetica Neue, Arial, sans-serif' font-size='14' fill='#52514e'>Опрос через шелл, сессия A: 271 шаг в час</text>
</svg>